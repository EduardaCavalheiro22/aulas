<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agenda de Entregas</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>Agenda de Entregas</h1>
        <p>Provas, trabalhos e apresentações em um só lugar.</p>
    </header>

    <main class="app">

        <section class="resumo">
            <h2>Resumo</h2>

            <div class="totalPendentes">
                <p id="totalPendentes">Pendentes: 0</p>
            </div>

            <div class="proximaEntregas">
            <p id="proximaEntrega">
            Próxima entrega: Nada pendente
            </p>
            </div>
        </section>

        <section class="nova">
        <h2>Nova Entrega</h2>

        <form id="formulario" class="formulario">

        <p>
            <label for="materia">Matéria:</label>
            <input type="text" id="materia" placeholder="Digite a matéria" required>
        </p>

        <p>
        <label for="tipo">Tipo:</label>
        <select id="tipo" required>
            <option value="">Escolha um tipo</option>
            <option value="prova">Prova</option>
            <option value="trabalho">Trabalho</option>
            <option value="apresentacao">Apresentação</option>
        </select>
        </p>

        <p>
            <label for="data">Data:</label>
            <input type="date" id="data" required>
        </p>

        <button type="submit">Adicionar</button>

        </form>
        </section>

        <section class="entregas">
        <h2>Próximas Entregas</h2>

        <div>
        <label for="mostrar">Mostrar:</label>

        <select id="mostrar">
            <option value="todos">Tudo</option>
            <option value="prova">Só Provas</option>
            <option value="trabalho">Só Trabalhos</option>
            <option value="apresentacao">Só Apresentações</option>
        </select>
        </div>

        <ul class="listaEntregas" id="listaEntregas"></ul>

        </section>

    </main>

    <footer>
        <p>Feito por Eduarda Cavalheiro</p>
    </footer>

</body>
</html>
