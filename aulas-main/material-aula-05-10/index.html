<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clique no alvo</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="jogo">

        <header class="topo">
            <h1>Clique no alvo</h1>

            <div class="placar">
                <p>Pontos <strong class="pontos">0</strong></p>
                <p>Tempo <strong class="tempo">30</strong></p>
                <p>Recorde <strong class="recorde">0</strong></p>
            </div>
        </header>

        <div class="arena">
            <button type="button" class="alvo escondido" aria-label="Alvo"></button>
        </div>

        <button type="button" class="botao-comecar">Começar</button>
        <p class="mensagem">Acerte o máximo de alvos em 30 segundos.</p>

    </main>

</body>

</html>
